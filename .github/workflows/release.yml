name: Build and Release Desktop .exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: dotnet
        run: dotnet restore src/MarkItDown.App/MarkItDown.App.csproj

      - name: Publish Self-Contained Single-File Executable
        working-directory: dotnet
        run: |
          dotnet publish src/MarkItDown.App/MarkItDown.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../release

      - name: Rename and Prepare Asset
        run: |
          Copy-Item "release/MarkItDown.App.exe" -Destination "MarkItDownStudio.exe" -Force
          Compress-Archive -Path "MarkItDownStudio.exe" -DestinationPath "MarkItDownStudio-win-x64.zip" -Force

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.0.1' }}
          name: MarkItDown Studio Release ${{ github.ref_name || 'v0.0.1' }}
          body: |
            ## 📄 MarkItDown Studio v0.0.1

            ### 🌟 Yangiliklar / What's New:
            - 🚀 **100% Self-Contained Standalone .exe:** .NET yoki boshqa kutubxonalarni o'rnatish shart emas.
            - 🤖 **Universal Multi-AI & Smart Fallback:** Google Gemini, Groq AI (500+ tok/s), OpenAI GPT-4o, Claude 3.7, DeepSeek R1/V3, Ollama.
            - 🔍 **AI Proofreader & Formatting Review:** Hujjatdagi orfografik va jadval xatolarini AI bilan tekshirish.
            - 🌐 **3 Ta Tilda Qo'llab-quvvatlash:** 🇺🇿 O'zbekcha, 🇬🇧 English, 🇷🇺 Русский.
            - 📑 **Obsidian & Markdown Clean Output:** Toza, tartibli Markdown formatlash.

            ### 📦 Yuklab Olish / Downloads:
            - **`MarkItDownStudio.exe`** — To'g'ridan-to'g'ri ishga tushadigan dastur (Windows 10/11 64-bit)
            - **`MarkItDownStudio-win-x64.zip`** — ZIP arxivlangan ko'rinishi
          files: |
            MarkItDownStudio.exe
            MarkItDownStudio-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
